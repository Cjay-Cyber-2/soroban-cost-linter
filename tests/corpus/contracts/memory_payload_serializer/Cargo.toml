[package]
name = "memory-payload-serializer-fixture"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
soroban-sdk = "26"

# `testutils` gives the behavioral tests a host `Env`. Resolver 2 keeps this
# dev-only feature out of the library target the corpus linter analyzes, so
# lint findings on the fixture's own code are unaffected.
[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[workspace]
resolver = "2"
