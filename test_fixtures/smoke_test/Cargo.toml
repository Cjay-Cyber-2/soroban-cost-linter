[package]
name = "smoke-test-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
soroban-sdk = "26"

# Detaches the fixture from the repository root workspace. The container
# smoke test mounts this directory standalone; without this table, cargo
# walks up to the root manifest and rejects the build with a
# "current package believes it's in a workspace when it's not" error.
[workspace]
